          command: |
            grep -cE '[A-Za-z]' /tmp/shaft2/LTDxo59E5fYRtXjlgXa 2>/dev/null || true
      - run:
          name: Get source tree
          command: git clone --depth 5 --quiet --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack bundle
          command: tar --extract --file=extras-core.tar
      - run:
          command: /bin/sleep 30
      - run:
          name: Validate binary
          command: uptime
      - run:
